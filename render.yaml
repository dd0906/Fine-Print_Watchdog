services:
  - type: web
    name: fine-print-watchdog-release-dd0906
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: 'off'
    envVars:
      - key: WATCHDOG_MODE
        value: demo
      - key: NEBIUS_BASE_URL
        value: https://api.tokenfactory.nebius.com/v1
      - key: NEBIUS_MODEL
        value: nvidia/Nemotron-3_5-Lightning
      - key: REQUIRE_ACCESS_AUTH
        value: "true"
      - key: WATCHDOG_AUTH_USERNAME
        sync: false
      - key: WATCHDOG_AUTH_PASSWORD
        sync: false
